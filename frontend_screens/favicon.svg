<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ASTRA X / NIYUKTI Official Geometric Favicon -->
  <rect width="64" height="64" rx="14" fill="#0F1720" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#B87333" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Subtle Cardinal Axis -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#B87333" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.4" />
  <line x1="8" y1="32" x2="56" y2="32" stroke="#B87333" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.4" />

  <!-- Niyukti Directional Opportunity Vector & Upward Talent Growth Lines -->
  <!-- People (Central upward ray) -->
  <line x1="32" y1="12" x2="32" y2="28" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="32,9 35,13 32,17 29,13" fill="#F59E0B" />

  <!-- Skills & Opportunity (Symmetrical telemetry wings) -->
  <path d="M 32,28 C 24,18 16,16 10,12 C 18,22 24,28 28,32" stroke="#5B7CCB" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 32,28 C 40,18 48,16 54,12 C 46,22 40,28 36,32" stroke="#B87333" stroke-width="2" fill="none" stroke-linecap="round" />

  <path d="M 28,32 L 14,48 L 22,46 L 32,36" fill="#0F766E" opacity="0.9" />
  <path d="M 36,32 L 50,48 L 42,46 L 32,36" fill="#B87333" opacity="0.9" />

  <!-- Central Bindu Diamond -->
  <polygon points="32,26 38,32 32,38 26,32" fill="#F59E0B" />
  <polygon points="32,28.5 35.5,32 32,35.5 28.5,32" fill="#0F1720" />

  <!-- Telemetry Satellite Nodes -->
  <polygon points="32,53 34.5,55.5 32,58 29.5,55.5" fill="#B87333" />
</svg>
